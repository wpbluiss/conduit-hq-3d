<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conduit AI — Virtual HQ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0b10; }
    canvas { display: block; }
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0a0b10; color: #3b82f6; font-family: 'Segoe UI', system-ui, sans-serif;
      z-index: 100; transition: opacity 0.8s;
    }
    #loading h1 { font-size: 2rem; letter-spacing: 0.3em; margin-bottom: 1rem; }
    #loading .bar { width: 200px; height: 2px; background: #1a1b2e; border-radius: 1px; }
    #loading .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #06b6d4); border-radius: 1px; transition: width 0.3s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #controls-hint {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      color: #6b7280; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 0.85rem;
      text-align: center; pointer-events: none; opacity: 0.8;
      transition: opacity 0.5s;
    }
    #controls-hint.hidden { opacity: 0; }
  </style>
</head>
<body>
  <div id="loading">
    <h1>CONDUIT AI</h1>
    <div class="bar"><div class="bar-fill" id="load-bar"></div></div>
  </div>
  <div id="controls-hint">Click to look around — WASD to move</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
