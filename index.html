<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conduit AI — Virtual HQ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0b10; }
    canvas { display: block; }

    /* ── Loading Screen ── */
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0a0b10;
      z-index: 100; transition: opacity 1.2s ease-out;
    }
    #loading.done { opacity: 0; pointer-events: none; }

    /* Logo */
    #loading .logo-container {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      margin-bottom: 48px;
    }
    #loading .logo-icon {
      width: 64px; height: 64px;
      border: 2px solid rgba(59,130,246,0.5);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(59,130,246,0.08);
      animation: logoPulse 2s ease-in-out infinite;
    }
    #loading .logo-icon svg {
      width: 32px; height: 32px;
    }
    #loading .logo-text {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 28px; font-weight: 700; letter-spacing: 0.25em;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #loading .logo-sub {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 12px; letter-spacing: 0.15em; color: #475569; font-weight: 500;
    }

    /* Loading text */
    #loading .load-message {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px; color: #64748b; margin-bottom: 20px;
      letter-spacing: 0.04em;
    }

    /* Progress bar */
    #loading .bar-track {
      width: 280px; height: 3px;
      background: rgba(30,30,50,0.8); border-radius: 2px;
      overflow: hidden; position: relative;
    }
    #loading .bar-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #3b82f6, #06b6d4, #8b5cf6);
      border-radius: 2px;
      transition: width 0.4s ease-out;
      box-shadow: 0 0 12px rgba(59,130,246,0.5);
    }
    #loading .bar-glow {
      position: absolute; top: -4px; height: 11px; width: 40px;
      background: radial-gradient(ellipse, rgba(59,130,246,0.6) 0%, transparent 70%);
      border-radius: 50%;
      animation: barGlow 2s ease-in-out infinite;
      pointer-events: none;
    }

    /* Percentage */
    #loading .load-pct {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 12px; color: #3b82f6; margin-top: 12px;
      letter-spacing: 0.1em; font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0.3); }
      50% { box-shadow: 0 0 0 12px rgba(59,130,246,0); }
    }
    @keyframes barGlow {
      0%, 100% { left: -10%; }
      50% { left: 90%; }
    }

    /* Controls hint */
    #controls-hint {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      color: #6b7280; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 0.85rem;
      text-align: center; pointer-events: none; opacity: 0.8;
      transition: opacity 0.5s;
    }
    #controls-hint.hidden { opacity: 0; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo-container">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <defs><linearGradient id="logoGrad" x1="0" y1="0" x2="24" y2="24"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs>
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="logo-text">CONDUIT AI</div>
      <div class="logo-sub">VIRTUAL HEADQUARTERS</div>
    </div>
    <div class="load-message">Loading your virtual headquarters...</div>
    <div class="bar-track">
      <div class="bar-fill" id="load-bar"></div>
      <div class="bar-glow"></div>
    </div>
    <div class="load-pct" id="load-pct">0%</div>
  </div>
  <div id="controls-hint">Click to look around — WASD to move</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
